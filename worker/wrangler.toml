# Cloudflare Worker deploy config for the Stacks comments worker.
# Used by the GitHub Action (ops/deploy-worker.yml) to auto-deploy
# worker/index.js whenever it changes on main.
#
# Fill the two IDs below ONCE (they are identifiers, not secrets):
#   account_id  -> Cloudflare dashboard, right sidebar "Account ID"
#   database_id -> Storage & Databases > D1 > stacks-comments > "Database ID"
# The real secret (the API token) lives in GitHub Actions secrets, not here.

name = "stacks-comments"
main = "index.js"
compatibility_date = "2024-11-01"

account_id = "898876c2b7fe1652e72736e182ad610b"

routes = [
  { pattern = "api.stacksdaily.com", custom_domain = true }
]

# D1 binding must match the binding the worker already uses (env.DB).
# Secrets set in the dashboard (ONESIGNAL_REST_KEY, NOTIFY_SECRET, ADMIN_KEY,
# PUBLISH_GITHUB_TOKEN) persist across deploys; wrangler does not touch them.
# PUBLISH_GITHUB_TOKEN is a fine-grained GitHub token scoped only to
# Stacks112/Stacks with Actions: write permission. Never put its value in this
# file or in the repository.
[[d1_databases]]
binding = "DB"
database_name = "stacks-comments"
database_id = "ddc4f84e-badf-4ff2-9b4e-f07c378784cf"

# Cron triggers:
# - Every five minutes: inspect pending_cards and dispatch apply-pending.yml.
# - Weekdays 23:00/23:05/23:10/23:15 UTC = KST Tue-Sat 08:00: surge alerts.
# Four surge firings, not one, because the Workers Free plan allows only 50
# subrequests per invocation and pricing all followed companies needs ~79.
# index.js derives the role from the minute: index = minute / 5, so
#   :00 -> shard 0, :05 -> shard 1, :10 -> shard 2, :15 -> push-only sweeper.
# The number of SCANNING minutes here MUST equal SURGE_SHARDS in index.js, and
# the last minute must stay past it so the sweeper exists.
[triggers]
crons = ["*/5 * * * *", "0,5,10,15 23 * * 1-5"]
