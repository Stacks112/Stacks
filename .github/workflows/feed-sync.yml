name: Sync source feeds

on:
  schedule:
    - cron: "30 */2 * * *"   # every 2 hours
  workflow_dispatch: {}       # adds a manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: stacks-feed-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch feeds
        run: |
          pip install requests --quiet
          python scripts/fetch_feeds.py

      - name: Commit changes (if any)
        run: |
          git config user.name "stacks-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds/
          if git diff --cached --quiet; then
            echo "no feed changes"
            exit 0
          fi
          git commit -m "chore: sync source feeds"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "push race lost, retry $i"
            sleep $(( (RANDOM % 8) + 3 ))
          done
          echo "::error::push failed after 5 attempts (concurrent commit on main)"
          exit 1
