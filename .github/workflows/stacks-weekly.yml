name: Stacks Weekly Best

# Every Sunday 08:00 KST (= Saturday 23:00 UTC): build the weekly digest in
# ko/en/ja under weekly/, commit it, email subscribers (Resend), and push an
# announcement to readers.
#
# Manual runs (workflow_dispatch) accept a test_to input: when set, the email
# goes ONLY to that address (subscriber list is not touched) so you can verify
# delivery + look before broadcasting.
on:
  schedule:
    - cron: "0 23 * * 6"
  workflow_dispatch:
    inputs:
      test_to:
        description: "Test send: email address to send ONLY to (leave blank for real broadcast)"
        required: false
        default: ""
      lang:
        description: "Email language (ko/en/ja)"
        required: false
        default: "ko"
      dry_run:
        description: "1 = build messages but do not actually send"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: stacks-weekly
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 발송 직전 게이트. 잘못 나간 메일은 회수할 수 없으므로, 렌더가 깨졌으면
      # 여기서 job을 죽여 아래 발송 스텝이 아예 돌지 않게 한다.
      # 2026-08-03: gist 블록 마커(@@REF@@ 등)가 변환되지 않은 채 수신함에
      # 그대로 찍히던 것을 열흘 뒤에야 사람이 눈으로 발견했다.
      - name: Guard — weekly email renders clean
        run: python scripts/check_email_render.py

      - name: Build weekly digest + email + announce
        env:
          STACKS_WORKER_URL: ${{ secrets.STACKS_WORKER_URL }}
          STACKS_NOTIFY_SECRET: ${{ secrets.STACKS_NOTIFY_SECRET }}
          SITE_URL: https://stacksdaily.com
          # --- email (Resend sends; subscribers live in the worker D1 store) ---
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          UNSUB_BASE: ${{ secrets.UNSUB_BASE }}
          UNSUB_SECRET: ${{ secrets.UNSUB_SECRET }}
          # --- manual test-send inputs (blank on scheduled runs) ---
          WEEKLY_TEST_TO: ${{ github.event.inputs.test_to }}
          WEEKLY_LANG: ${{ github.event.inputs.lang }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python scripts/weekly.py

      - name: Commit the digest
        # skip committing on a test-only manual run (no content should change,
        # but guard anyway so test runs never create commits)
        if: ${{ github.event.inputs.test_to == '' }}
        run: |
          if [ -z "$(git status --porcelain weekly/)" ]; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name  "stacks-bot"
          git config user.email "stacks-bot@users.noreply.github.com"
          git add weekly/
          git commit -m "content: weekly best digest [skip ci]"
          # Why not a plain `git pull --rebase`: every file this job writes is
          # GENERATED (feeds, sitemap, data/manifest.json, p/, e/, og/). When
          # another workflow pushes first, both sides have rewritten the same
          # generated lines, so the rebase hits a content conflict -- and it is
          # the SAME conflict on every retry, so all 5 attempts died and the
          # regenerated pages were silently dropped (2026-07-27).
          # There is nothing to merge in a derived file, so the commit being
          # replayed wins. During a rebase the replayed commit is "theirs".
          # Anything stale that leaves behind is corrected by the next build.
          for i in 1 2 3 4 5 6; do
            git fetch origin main || true
            if git rebase --autostash -X theirs FETCH_HEAD && git push origin main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "push race lost, retry $i"
            sleep $(( (RANDOM % 8) + 3 * i ))
          done
          echo "::error::push failed after 6 attempts (concurrent commit on main)"
          exit 1
