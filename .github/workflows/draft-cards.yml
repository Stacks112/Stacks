# Stacks Scout — draft cards from feeds with Claude and AUTO-PUBLISH to the site.
# Runs after feed-sync populates feeds/. Commits straight to main (no review gate):
#   scout.py writes items.json, build_pages.py regenerates the static pages,
#   everything is committed and pushed. Sole publisher of items.json.
name: Stacks Scout (auto-publish)

# NOTE: schedule removed — the live publisher is the session-based Routine
# "Stacks 자동 발행 파이프라인 v4.3" (every 3h at :40). This workflow is a manual
# fallback only (workflow_dispatch); it needs the ANTHROPIC_API_KEY secret.
on:
  workflow_dispatch:
    inputs:
      max_new:
        description: "Max new cards this run"
        required: false
        default: "3"

permissions:
  contents: write

concurrency:
  group: stacks-scout
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Draft cards, then rebuild pages if anything new
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: claude-sonnet-5
          MAX_NEW_ITEMS: ${{ github.event.inputs.max_new || '3' }}
          LOOKBACK_DAYS: "4"
          PER_SOURCE_CAP: "2"
        run: |
          python scripts/scout.py
          if git diff --quiet -- items.json; then
            echo "No new cards this run — skipping build."
            exit 0
          fi
          python scripts/build_pages.py

      - name: Publish to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- items.json; then
            echo "Nothing to publish."
            exit 0
          fi
          rm -f .scout_pr_body.md
          git config user.name  "stacks-scout[bot]"
          git config user.email "stacks-scout[bot]@users.noreply.github.com"
          git add -A
          git commit -m "content: auto-publish scout cards"
          # Why not a plain `git pull --rebase`: every file this job writes is
          # GENERATED (feeds, sitemap, data/manifest.json, p/, e/, og/). When
          # another workflow pushes first, both sides have rewritten the same
          # generated lines, so the rebase hits a content conflict -- and it is
          # the SAME conflict on every retry, so all 5 attempts died and the
          # regenerated pages were silently dropped (2026-07-27).
          # There is nothing to merge in a derived file, so the commit being
          # replayed wins. During a rebase the replayed commit is "theirs".
          # Anything stale that leaves behind is corrected by the next build.
          for i in 1 2 3 4 5 6; do
            git fetch origin main || true
            if git rebase --autostash -X theirs FETCH_HEAD && git push origin main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "push race lost, retry $i"
            sleep $(( (RANDOM % 8) + 3 * i ))
          done
          echo "::error::push failed after 6 attempts (concurrent commit on main)"
          exit 1
