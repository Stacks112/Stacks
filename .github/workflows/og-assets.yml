name: OG card images

# Fetches subject images (Wikipedia photos / company logos) for the share
# cards and regenerates og/. Runs on a GitHub runner, which — unlike the
# publishing sandbox — has open network access.

on:
  schedule:
    - cron: "20 */6 * * *"     # a few times a day
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "items.json"
      - "index.html"
      # 2026-08-04: 큐레이션 용어집. build_pages가 이걸 items.json entities로 병합하므로
      # 여기 없으면 새 용어가 6시간 크론이 돌 때까지 앱에 안 나타난다(실제로 그랬다).
      - "glossary.json"
      - "scripts/build_pages.py"
      - "scripts/build_data.py"
      - "scripts/fetch_og_assets.py"
      - "scripts/fetch_cover_assets.py"
      - "scripts/fetch_ref_images.py"
      - "scripts/fetch_embeds.py"

permissions:
  contents: write

concurrency:
  group: og-assets
  cancel-in-progress: false

jobs:
  og:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install CJK font for share cards
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: Install poppler (PDF -> PNG for document covers)
        run: sudo apt-get install -y -qq poppler-utils

      - name: Fetch subject images + article covers + in-body link images + rebuild cards
        env:
          STACKS_WORKER_URL: ${{ secrets.STACKS_WORKER_URL }}
        run: |
          pip install requests pillow --quiet
          python scripts/fetch_cover_assets.py
          python scripts/fetch_ref_images.py
          python scripts/fetch_og_assets.py
          python scripts/fetch_embeds.py
          rm -f og/*.png
          python scripts/build_pages.py
          python scripts/build_data.py

      - name: Commit card images (if any)
        run: |
          git config user.name "stacks-og-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: refresh OG cards + article covers"
          # Why not a plain `git pull --rebase`: every file this job writes is
          # GENERATED (feeds, sitemap, data/manifest.json, p/, e/, og/). When
          # another workflow pushes first, both sides have rewritten the same
          # generated lines, so the rebase hits a content conflict -- and it is
          # the SAME conflict on every retry, so all 5 attempts died and the
          # regenerated pages were silently dropped (2026-07-27).
          # There is nothing to merge in a derived file, so the commit being
          # replayed wins. During a rebase the replayed commit is "theirs".
          # Anything stale that leaves behind is corrected by the next build.
          for i in 1 2 3 4 5 6; do
            git fetch origin main || true
            if git rebase --autostash -X theirs FETCH_HEAD && git push origin main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "push race lost, retry $i"
            sleep $(( (RANDOM % 8) + 3 * i ))
          done
          echo "::error::push failed after 6 attempts (concurrent commit on main)"
          exit 1
