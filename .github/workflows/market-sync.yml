name: Market bar sync

on:
  # D+1 데이터는 기준일 다음 영업일 오후 1시 이후 갱신 → KST 14:00 에 받는다.
  # apis.data.go.kr 는 응답이 느릴 때가 있어 스크립트가 90초 타임아웃 × 3회 재시도한다.
  schedule:
    - cron: "0 5 * * 1-5"   # UTC 05:00 = KST 14:00, 평일
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Probe data.go.kr reachability
        id: probe
        continue-on-error: true
        run: |
          curl -sS -4 -o /dev/null --max-time 60 -w "code=%{http_code} total=%{time_total}s\n" \
            "https://apis.data.go.kr/"
          rc=$?
          echo "curl rc=$rc"
          if [ "$rc" -eq 0 ]; then
            echo "KR_OK=1" >> "$GITHUB_OUTPUT"
          else
            echo "KR_OK=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch market data
        if: steps.probe.outputs.KR_OK == '1'
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/fetch_market.py

      - name: Commit and push data/market.json
        if: steps.probe.outputs.KR_OK == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/market.json

          if git diff --cached --quiet -- data/market.json; then
            echo "no changes to data/market.json; skipping commit"
            exit 0
          fi

          git commit -m "chore(data): market bar snapshot"

          attempt=1
          max_attempts=3
          until [ "$attempt" -gt "$max_attempts" ]; do
            echo "push attempt $attempt/$max_attempts"
            git fetch origin main
            if git rebase --autostash -X theirs FETCH_HEAD; then
              if git push; then
                echo "push succeeded"
                exit 0
              fi
              echo "push failed after successful rebase"
            else
              git rebase --abort
              echo "rebase failed"
            fi
            attempt=$((attempt + 1))
            sleep 5
          done

          echo "push failed after $max_attempts attempts"
          exit 1
