name: Apply security headers

on:
  push:
    branches: [main]
    paths:
      - "ops/cloudflare-response-headers.json"
      - "scripts/apply_cloudflare_response_headers.mjs"
      - ".github/workflows/security-headers.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply Cloudflare response-header policy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: node scripts/apply_cloudflare_response_headers.mjs
