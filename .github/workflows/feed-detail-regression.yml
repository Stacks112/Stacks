name: Feed detail regression

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/v82.js"
      - "assets/v82.css"
      - "assets/v83tw.js"
      - "assets/investor-compare.js"
      - "assets/investor-compare.css"
      - "portfolios.json"
      - "items.json"
      - "scripts/build_pages.py"
      - "tests/test_frontend_contracts.py"
      - "tests/feed-detail.spec.mjs"
      - "playwright.config.mjs"
      - "package.json"
      - ".github/workflows/feed-detail-regression.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install test runner
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run frontend contract tests
        run: python3 tests/test_frontend_contracts.py

      - name: Run feed/detail regression tests
        run: npm run test:feed-detail -- --reporter=line
