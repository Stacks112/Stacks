name: 13F portfolio refresh

# 13F-HR 마감(분기말+45일) 전후에만 scripts/fetch_13f.py를 돌려 portfolios.json을
# 갱신한다. 마감일은 2/14·5/15·8/14·11/14 근처(주말이면 다음 영업일)이고, 실측상
# 로스터의 상당수가 마감일 당일에 몰아서 내고 ARK·듀케인 등 일부만 며칠 먼저
# 낸다 — 그래서 그 달의 8~19일을 통째로 덮어 하루 1회 확인한다. 나머지 8개월은
# 이 워크플로 자체가 돌지 않는다.
#
# scripts/fetch_13f.py는 표준 라이브러리만 쓰고(추가 pip 설치 불필요), SEC가
# 요구하는 User-Agent도 스크립트 안에 하드코딩돼 있다 — 시크릿·env 불필요.
# 실패 처리도 스크립트 자체가 이미 한다: 투자자 1곳이 실패해도 나머지는 계속
# 진행하고, 전원 실패면 portfolios.json을 아예 건드리지 않고 그대로 둔다
# (scripts/fetch_13f.py 하단 `any_ok` 체크 참고). 이 워크플로가 추가로 하는 일은
# "전원 실패"를 조용히 넘기지 않고 실패로 남기는 것뿐이다 — 스크립트는 그 경우도
# exit 0로 끝내므로, 러너 쪽에서 [ok]/[fail] 로그를 세어 판단한다.

on:
  schedule:
    - cron: "0 22 8-19 2,5,8,11 *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: stacks-13f-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch 13F filings
        id: fetch
        run: |
          python3 scripts/fetch_13f.py 2>&1 | tee fetch_13f.log
          {
            echo "ok_count=$(grep -c '^\[ok\]' fetch_13f.log || true)"
            echo "fail_count=$(grep -c '^\[fail\]' fetch_13f.log || true)"
          } >> "$GITHUB_OUTPUT"

      - name: Fail loudly if every investor failed
        # fetch_13f.py exits 0 even when every investor failed (it leaves
        # portfolios.json untouched on purpose - see its `any_ok` check) so
        # a clean exit code alone can't tell us the run was useless. Count
        # the [ok]/[fail] lines it printed instead.
        if: steps.fetch.outputs.ok_count == '0'
        run: |
          echo "::error::13F 갱신 실패 - 등록된 투자자 전원 fetch 실패. portfolios.json은 이전 상태 그대로입니다. 아래 로그와 실행 링크를 확인하세요."
          exit 1

      - name: Warn on partial failure
        if: steps.fetch.outputs.fail_count != '0' && steps.fetch.outputs.ok_count != '0'
        run: |
          echo "::warning::일부 투자자 fetch 실패 (계속 진행 - 실패한 투자자는 이전 데이터 유지). fetch_13f.log의 [fail] 라인 참고."

      - name: Commit and push (if changed)
        run: |
          if git diff --quiet -- portfolios.json; then
            echo "no changes to portfolios.json"
            exit 0
          fi
          git config user.name  "stacks-13f-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolios.json
          updated=$(grep '^\[ok\]' fetch_13f.log | sed -E 's/^\[ok\] ([a-z0-9-]+):.*/\1/' | paste -sd, -)
          git commit -m "chore: refresh 13F portfolios${updated:+ ($updated)}"
          # Why not a plain `git pull --rebase`: every file this job writes is
          # GENERATED (feeds, sitemap, data/manifest.json, p/, e/, og/). When
          # another workflow pushes first, both sides have rewritten the same
          # generated lines, so the rebase hits a content conflict -- and it is
          # the SAME conflict on every retry, so all 5 attempts died and the
          # regenerated pages were silently dropped (2026-07-27).
          # There is nothing to merge in a derived file, so the commit being
          # replayed wins. During a rebase the replayed commit is "theirs".
          # Anything stale that leaves behind is corrected by the next build.
          for i in 1 2 3 4 5 6; do
            git fetch origin main || true
            if git rebase --autostash -X theirs FETCH_HEAD && git push origin main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "push race lost, retry $i"
            sleep $(( (RANDOM % 8) + 3 * i ))
          done
          echo "::error::push failed after 6 attempts (concurrent commit on main)"
          exit 1

      - name: Open an issue so failure survives being missed
        # 다음 기회는 3개월 뒤뿐이라, 이 워크플로가 실패했는데 아무도 못 보면
        # 8/14(또는 다음 마감일) 갱신이 그냥 통째로 비어버린다. clobber-guard.yml과
        # 같은 패턴: 실패를 로그에만 남기지 않고 이슈로도 남긴다.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "13F 갱신 워크플로가 실패했습니다."
            echo
            echo '```'
            cat fetch_13f.log 2>/dev/null || echo "(로그 없음 - fetch 단계 이전에 실패)"
            echo '```'
            echo
            echo "실행: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > issue.md
          gh issue create \
            --title "⚠ 13F 자동 갱신 실패 ($(date -u +%F))" \
            --body-file issue.md \
            --label "13f" 2>/dev/null \
          || gh issue create \
            --title "⚠ 13F 자동 갱신 실패 ($(date -u +%F))" \
            --body-file issue.md
