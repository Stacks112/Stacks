name: Stacks Grade Predictions

# Grade due predictions in items.json each morning, then commit + push.
# 21:30 UTC = 06:30 KST. Also runnable by hand from the Actions tab.
# Runs on a real headless runner with a native GITHUB_TOKEN, so unlike the
# Cowork scheduled session it can web-search AND push (no 403 proxy block).
on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stacks-grade
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Grade due predictions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: claude-sonnet-5
          MAX_GRADE: "12"
          WEB_SEARCH_USES: "4"
          # Graded-prediction pushes are relayed by notify-followers.yml, which
          # fires on any push that touches items.json and now detects
          # outcome.status pending -> hit/miss (2026-08-04). Keep this at "0":
          # with "1" every grade done here would send twice, and grading done by
          # the scheduled Cowork session would still send zero (that session
          # cannot reach api.stacksdaily.com at all -- egress proxy 403).
          GRADE_PUSH: "0"
          STACKS_WORKER_URL: ${{ secrets.STACKS_WORKER_URL }}
          STACKS_NOTIFY_SECRET: ${{ secrets.STACKS_NOTIFY_SECRET }}
          SITE_URL: https://stacksdaily.com
        run: python scripts/grade.py

      - name: Commit graded outcomes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- items.json; then
            echo "No grading changes this run."
            exit 0
          fi
          git config user.name  "stacks-bot"
          git config user.email "stacks-bot@users.noreply.github.com"
          git add items.json
          git commit -m "chore: grade predictions"
          # Why not a plain `git pull --rebase`: every file this job writes is
          # GENERATED (feeds, sitemap, data/manifest.json, p/, e/, og/). When
          # another workflow pushes first, both sides have rewritten the same
          # generated lines, so the rebase hits a content conflict -- and it is
          # the SAME conflict on every retry, so all 5 attempts died and the
          # regenerated pages were silently dropped (2026-07-27).
          # There is nothing to merge in a derived file, so the commit being
          # replayed wins. During a rebase the replayed commit is "theirs".
          # Anything stale that leaves behind is corrected by the next build.
          for i in 1 2 3 4 5 6; do
            git fetch origin main || true
            if git rebase --autostash -X theirs FETCH_HEAD && git push origin main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "push race lost, retry $i"
            sleep $(( (RANDOM % 8) + 3 * i ))
          done
          echo "::error::push failed after 6 attempts (concurrent commit on main)"
          exit 1
